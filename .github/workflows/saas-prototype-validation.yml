name: SaaS Prototype Validation

on:
  pull_request:
    paths:
      - "saas-prototype/**"
      - "docs/SAAS_UI_FOUNDATION.md"
      - "docs/SAAS_CUSTOMER_DISCOVERY.md"
      - "docs/SAAS_CUSTOMER_PORTFOLIO_REFERENCE_VALUE.md"
      - "docs/SAAS_CUSTOMER_SUBSCRIPTION_ENTITLEMENTS.md"
      - "docs/SAAS_PRIVATE_BETA_READINESS.md"
      - "docs/SAAS_PRIVATE_BETA_OPERATIONS_BOUNDARY.md"
      - "scripts/build-assets.js"
      - "scripts/validate-brand-assets.js"
      - "scripts/validate-consumer-ux-refinement.mjs"
      - "scripts/validate-saas-customer-discovery.mjs"
      - "scripts/validate-saas-customer-portfolio.mjs"
      - "scripts/validate-saas-customer-entitlements.mjs"
      - "scripts/validate-saas-private-beta-operations-boundary.mjs"
      - "scripts/validate-saas-private-beta-readiness.mjs"
      - "netlify.toml"
      - "package.json"
      - "_redirects"
      - "*.html"
      - ".github/workflows/saas-prototype-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate isolated SaaS prototype
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install website build dependencies
        run: npm install --no-audit --no-fund

      - name: Parse browser JavaScript
        run: |
          node --check saas-prototype/mock-data.js
          node --check saas-prototype/feature-data.js
          node --check saas-prototype/app.js
          node --check saas-prototype/feature-pages.js
          node --check saas-prototype/visual-intelligence.js
          node --check saas-prototype/cockpit-expansion.js
          node --check saas-prototype/cockpit-layout-fix.js
          node --check saas-prototype/cockpit-polish.js
          node --check saas-prototype/cockpit-final-ux.js
          node --check saas-prototype/consumer-ux-refinement.js
          node --check saas-prototype/customer-professional-polish.js
          node --check saas-prototype/sidebar-edge-fix.js
          node --check saas-prototype/route-guard.js
          node --check saas-prototype/customer-discovery.js
          node --check saas-prototype/customer-portfolio.js
          node --check saas-prototype/customer-entitlements.js
          node --check saas-prototype/private-beta.js
          node --check saas-prototype/serve.mjs
          node --check scripts/validate-consumer-ux-refinement.mjs
          node --check scripts/validate-saas-customer-entitlements.mjs

      - name: Run exact Netlify build command
        run: npm run build:identity && npm run validate:identity && npm run validate:account-lifecycle && npm run validate:customer-intelligence && npm run validate:customer-dashboard && npm run validate:customer-compare && npm run validate:customer-management && npm run validate:customer-portfolio && npm run validate:customer-lifecycle && npm run validate:customer-export && npm run validate:customer-discovery && npm run validate:customer-entitlements && npm run validate:private-beta-operations-boundary && npm run validate:private-beta && node scripts/build-assets.js && node scripts/validate-brand-assets.js

      - name: Run deterministic prototype checks
        run: |
          node saas-prototype/validate.mjs
          node saas-prototype/validate-visual-intelligence.mjs
          node saas-prototype/validate-cockpit-expansion.mjs
          node saas-prototype/validate-cockpit-polish.mjs
          node saas-prototype/validate-cockpit-final-ux.mjs
          node scripts/validate-consumer-ux-refinement.mjs
          node saas-prototype/validate-sidebar-edge-fix.mjs

      - name: Verify generated website entry points
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const htmlFiles = fs.readdirSync('.').filter(name => name.endsWith('.html'));
          const failures = [];

          for (const name of htmlFiles) {
            const html = fs.readFileSync(name, 'utf8');
            const hasHeader = html.includes('class="site-header"');
            const hasMobileNavigation = html.includes('id="mobile-navigation"');
            const hasFooterLinks = html.includes('class="footer-links"');

            if (html.includes('Signal. Confidence. Advantage.')) {
              failures.push(`${name}: deprecated brand line remains`);
            }
            if (hasHeader && !html.includes('Card Intelligence') && !html.includes('CARD INTELLIGENCE')) {
              failures.push(`${name}: Card Intelligence is missing`);
            }
            if (hasHeader && (html.includes('Card Value Intelligence') || html.includes('CARD VALUE INTELLIGENCE'))) {
              failures.push(`${name}: retired Card Value Intelligence descriptor remains`);
            }
            if (hasHeader && !html.includes('data-app-preview="desktop"')) {
              failures.push(`${name}: desktop App Preview link is missing`);
            }
            if (hasMobileNavigation && !html.includes('data-app-preview="mobile"')) {
              failures.push(`${name}: mobile App Preview link is missing`);
            }
            if (hasFooterLinks && !html.includes('data-app-preview="footer"')) {
              failures.push(`${name}: footer App Preview link is missing`);
            }
          }

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }

          console.log(`Verified App Preview and Card Intelligence across ${htmlFiles.length} website pages.`);
          NODE
          grep -q '/app /saas-prototype/index.html 200' _redirects
          grep -q '/app/ /saas-prototype/index.html 200' _redirects
          grep -q '/app/\* /saas-prototype/:splat 200' _redirects